spring.application.name=tiendacapas

# Base de datos: PostgreSQL en Docker (base-de-datos/docker-compose.yml).
# Los valores por defecto coinciden con el contenedor; para desplegar en otro lado se cambian con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tienda}
spring.datasource.username=${DB_USUARIO:tienda}
spring.datasource.password=${DB_CLAVE:tienda}

# Las tablas y los datos semilla los crea el contenedor al iniciarse por primera vez, no el backend.
spring.sql.init.mode=never
