# Solo pruebas: H2 en memoria en modo PostgreSQL, creada con base-de-datos/schema.sql y data.sql.
# Así ./mvnw test corre sin Docker; la app real usa PostgreSQL (src/main/resources/application.properties).
spring.application.name=tiendacapas
spring.datasource.url=jdbc:h2:mem:tienda;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
